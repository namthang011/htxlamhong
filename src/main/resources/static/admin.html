<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị HTX Lam Hồng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { min-height: 100vh; background: #212529; color: white; padding-top: 20px; }
        .sidebar a { color: #adb5bd; text-decoration: none; display: block; padding: 15px 20px; font-weight: 500; }
        .sidebar a:hover, .sidebar a.active { background: #0d6efd; color: white; border-radius: 5px; margin: 0 10px; }
        .hidden { display: none !important; }
        .login-box { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="loginScreen">
        <div class="login-box">
            <h3 class="text-center mb-4">Đăng Nhập Admin</h3>
            <div id="loginError" class="alert alert-danger hidden">Sai tài khoản hoặc mật khẩu!</div>
            <div class="mb-3">
                <label>Tài khoản</label>
                <input type="text" id="username" class="form-control">
            </div>
            <div class="mb-3">
                <label>Mật khẩu</label>
                <input type="password" id="password" class="form-control">
            </div>
            <button class="btn btn-primary w-100" onclick="login()">Đăng nhập</button>
        </div>
    </div>

    <!-- MÀN HÌNH QUẢN TRỊ -->
    <div id="dashboardScreen" class="hidden">
        <div class="d-flex">
            <!-- Sidebar -->
            <div class="sidebar" style="width: 250px;">
                <h4 class="text-center mb-4 text-white">Admin HTX</h4>
                <a href="#" class="active" id="nav-services" onclick="showTab('services')">📦 Quản lý Dịch vụ</a>
                <a href="#" id="nav-posts" onclick="showTab('posts')">📰 Quản lý Tin tức</a>
                <hr style="border-color: #495057;">
                <a href="#" onclick="logout()" class="text-danger">🚪 Đăng xuất</a>
            </div>

            <!-- Main Content -->
            <div class="flex-grow-1 p-4">
                
                <!-- Tab Dịch Vụ -->
                <div id="tab-services">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2>Quản lý Dịch vụ</h2>
                        <button class="btn btn-success" onclick="openServiceModal()">+ Thêm Dịch Vụ Mới</button>
                    </div>
                    <table class="table table-bordered table-hover bg-white">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Ảnh</th>
                                <th>Tên dịch vụ</th>
                                <th>Giá</th>
                                <th>Trạng thái</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="serviceTableBody">
                            <!-- JS Load -->
                        </tbody>
                    </table>
                </div>

                <!-- Tab Tin Tức -->
                <div id="tab-posts" class="hidden">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2>Quản lý Tin tức</h2>
                        <button class="btn btn-success" onclick="openPostModal()">+ Viết Bài Mới</button>
                    </div>
                    <table class="table table-bordered table-hover bg-white">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Ảnh</th>
                                <th>Tiêu đề</th>
                                <th>Ngày đăng</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="postTableBody">
                            <!-- JS Load -->
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <!-- MODAL DỊCH VỤ -->
    <div class="modal fade" id="serviceModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Thông tin Dịch vụ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="srv-id">
                    <div class="mb-3">
                        <label>Tên dịch vụ</label>
                        <input type="text" id="srv-name" class="form-control" onkeyup="generateSlug(this.value, 'srv-slug')">
                    </div>
                    <div class="mb-3">
                        <label>Đường dẫn (Slug)</label>
                        <input type="text" id="srv-slug" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Mô tả ngắn</label>
                        <input type="text" id="srv-summary" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Giá (VNĐ) - Bỏ trống nếu là Giá Liên Hệ</label>
                        <input type="number" id="srv-price" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Tải ảnh lên (Tự động lưu vào DB)</label>
                        <input type="file" id="srv-img-file" class="form-control" accept="image/*" onchange="encodeImageFileAsURL(this, 'srv-img', 'srv-img-preview')">
                        <input type="hidden" id="srv-img">
                        <img id="srv-img-preview" src="" style="max-height: 100px; margin-top: 10px; display: none;">
                    </div>
                    <div class="mb-3">
                        <label>Trạng thái</label>
                        <select id="srv-status" class="form-control">
                            <option value="ACTIVE">Hoạt động</option>
                            <option value="INACTIVE">Tạm ngưng</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="saveService()">Lưu Dịch Vụ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL TIN TỨC -->
    <div class="modal fade" id="postModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Thông tin Bài viết</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="post-id">
                    <div class="mb-3">
                        <label>Tiêu đề</label>
                        <input type="text" id="post-title" class="form-control" onkeyup="generateSlug(this.value, 'post-slug')">
                    </div>
                    <div class="mb-3">
                        <label>Đường dẫn (Slug)</label>
                        <input type="text" id="post-slug" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Mô tả ngắn</label>
                        <textarea id="post-summary" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                        <label>Nội dung chi tiết</label>
                        <textarea id="post-content" class="form-control" rows="5"></textarea>
                    </div>
                    <div class="mb-3">
                        <label>Tải ảnh lên (Tự động lưu vào DB)</label>
                        <input type="file" id="post-img-file" class="form-control" accept="image/*" onchange="encodeImageFileAsURL(this, 'post-img', 'post-img-preview')">
                        <input type="hidden" id="post-img">
                        <img id="post-img-preview" src="" style="max-height: 100px; margin-top: 10px; display: none;">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="savePost()">Lưu Bài Viết</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let jwtToken = "";
        let currentServices = [];
        let currentPosts = [];

        function encodeImageFileAsURL(element, hiddenId, previewId) {
            let file = element.files[0];
            let reader = new FileReader();
            reader.onloadend = function() {
                document.getElementById(hiddenId).value = reader.result;
                let preview = document.getElementById(previewId);
                preview.src = reader.result;
                preview.style.display = 'block';
            }
            if (file) { reader.readAsDataURL(file); }
        }

        function generateSlug(text, targetId) {
            let slug = text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            slug = slug.replace(/đ/g, "d").replace(/[^a-z0-9 ]/g, "").trim().replace(/\s+/g, "-");
            document.getElementById(targetId).value = slug;
        }

        function login() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            fetch(API_BASE_URL + "/api/public/login", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({username: user, password: pass})
            }).then(res => {
                if (res.ok) { return res.json(); }
                throw new Error("Login failed");
            }).then(data => {
                jwtToken = "Bearer " + data.token;
                localStorage.setItem("htx_jwt", jwtToken);
                document.getElementById("loginScreen").classList.add("hidden");
                document.getElementById("dashboardScreen").classList.remove("hidden");
                loadServices();
                loadPosts();
            }).catch(error => { document.getElementById("loginError").classList.remove("hidden"); });
        }

        function logout() { localStorage.removeItem("htx_jwt"); location.reload(); }

        window.onload = function() {
            const auth = localStorage.getItem("htx_jwt");
            if (auth) {
                jwtToken = auth;
                document.getElementById("loginScreen").classList.add("hidden");
                document.getElementById("dashboardScreen").classList.remove("hidden");
                loadServices();
                loadPosts();
            }
        }

        function showTab(tabName) {
            document.getElementById("tab-services").classList.add("hidden");
            document.getElementById("tab-posts").classList.add("hidden");
            document.getElementById("nav-services").classList.remove("active");
            document.getElementById("nav-posts").classList.remove("active");
            document.getElementById("tab-" + tabName).classList.remove("hidden");
            document.getElementById("nav-" + tabName).classList.add("active");
        }

        const serviceModal = new bootstrap.Modal(document.getElementById("serviceModal"));

        function loadServices() {
            fetch(API_BASE_URL + "/api/public/services?size=100").then(res => res.json()).then(data => {
                let html = "";
                if(data.content) {
                    currentServices = data.content;
                    data.content.forEach(s => {
                        html += `<tr><td>${s.id}</td><td><img src="${s.imageUrl}" height="40"></td><td>${s.name}</td><td>${s.price || "Liên hệ"}</td><td><span class="badge bg-${s.status=="ACTIVE"?"success":"secondary"}">${s.status == 'ACTIVE' ? 'Hoạt động' : 'Tạm ngưng'}</span></td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="editService(${s.id})">Sửa</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteService(${s.id})">Xóa</button>
                        </td></tr>`;
                    });
                }
                document.getElementById("serviceTableBody").innerHTML = html;
            });
        }
        function openServiceModal() { 
            document.getElementById("srv-id").value = ""; 
            document.getElementById("srv-name").value = ""; 
            document.getElementById("srv-slug").value = ""; 
            document.getElementById("srv-summary").value = ""; 
            document.getElementById("srv-price").value = ""; 
            document.getElementById("srv-img").value = ""; 
            document.getElementById("srv-img-preview").style.display = "none"; 
            document.getElementById("srv-img-file").value = "";
            document.getElementById("srv-status").value = "ACTIVE";
            serviceModal.show(); 
        }
        function editService(id) {
            const s = currentServices.find(x => x.id === id);
            if(s) {
                document.getElementById("srv-id").value = s.id; 
                document.getElementById("srv-name").value = s.name; 
                document.getElementById("srv-slug").value = s.slug; 
                document.getElementById("srv-summary").value = s.summary; 
                document.getElementById("srv-price").value = s.price || ""; 
                document.getElementById("srv-img").value = s.imageUrl || ""; 
                document.getElementById("srv-img-preview").src = s.imageUrl || ""; 
                document.getElementById("srv-img-preview").style.display = "block";
                document.getElementById("srv-status").value = s.status || "ACTIVE";
                serviceModal.show(); 
            }
        }
        function saveService() {
            const id = document.getElementById("srv-id").value;
            const data = { 
                name: document.getElementById("srv-name").value, 
                slug: document.getElementById("srv-slug").value, 
                summary: document.getElementById("srv-summary").value, 
                price: document.getElementById("srv-price").value || null, 
                imageUrl: document.getElementById("srv-img").value, 
                status: document.getElementById("srv-status").value 
            };
            let url = "/api/admin/services";
            let method = "POST";
            if(id) { url += "/" + id; method = "PUT"; }
            
            fetch(url, { method: method, headers: { "Authorization": jwtToken, "Content-Type": "application/json" }, body: JSON.stringify(data) })
            .then(res => { 
                if(res.ok) { serviceModal.hide(); loadServices(); } 
                else if (res.status === 403 || res.status === 401) { alert("Phiên đăng nhập hết hạn. Vui lòng đăng xuất và đăng nhập lại!"); }
                else { alert("Lỗi khi lưu! Vui lòng thử lại."); }
            });
        }
        function deleteService(id) { 
            if(confirm("Xóa dịch vụ này?")) fetch(API_BASE_URL + "/api/admin/services/" + id, { method: "DELETE", headers: { "Authorization": jwtToken } }).then(() => loadServices()); 
        }

        const postModal = new bootstrap.Modal(document.getElementById("postModal"));
        function loadPosts() {
            fetch(API_BASE_URL + "/api/public/posts?size=100").then(res => res.json()).then(data => {
                let html = "";
                if(data.content) {
                    currentPosts = data.content;
                    data.content.forEach(p => {
                        html += `<tr><td>${p.id}</td><td><img src="${p.thumbnailUrl}" height="40"></td><td>${p.title}</td><td>${new Date(p.createdAt).toLocaleDateString()}</td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="editPost(${p.id})">Sửa</button>
                            <button class="btn btn-sm btn-danger" onclick="deletePost(${p.id})">Xóa</button>
                        </td></tr>`;
                    });
                }
                document.getElementById("postTableBody").innerHTML = html;
            });
        }
        function openPostModal() { 
            document.getElementById("post-id").value = ""; 
            document.getElementById("post-title").value = ""; 
            document.getElementById("post-slug").value = ""; 
            document.getElementById("post-summary").value = ""; 
            document.getElementById("post-content").value = ""; 
            document.getElementById("post-img").value = ""; 
            document.getElementById("post-img-preview").style.display = "none"; 
            document.getElementById("post-img-file").value = "";
            postModal.show(); 
        }
        function editPost(id) {
            const p = currentPosts.find(x => x.id === id);
            if(p) {
                document.getElementById("post-id").value = p.id; 
                document.getElementById("post-title").value = p.title; 
                document.getElementById("post-slug").value = p.slug; 
                document.getElementById("post-summary").value = p.summary || ""; 
                document.getElementById("post-content").value = p.content || ""; 
                document.getElementById("post-img").value = p.thumbnailUrl || ""; 
                document.getElementById("post-img-preview").src = p.thumbnailUrl || ""; 
                document.getElementById("post-img-preview").style.display = "block";
                postModal.show(); 
            }
        }
        function savePost() {
            const id = document.getElementById("post-id").value;
            const data = { 
                title: document.getElementById("post-title").value, 
                slug: document.getElementById("post-slug").value, 
                summary: document.getElementById("post-summary").value, 
                content: document.getElementById("post-content").value, 
                thumbnailUrl: document.getElementById("post-img").value 
            };
            let url = "/api/admin/posts";
            let method = "POST";
            if(id) { url += "/" + id; method = "PUT"; }
            
            fetch(url, { method: method, headers: { "Authorization": jwtToken, "Content-Type": "application/json" }, body: JSON.stringify(data) })
            .then(res => { 
                if(res.ok) { postModal.hide(); loadPosts(); } 
                else if (res.status === 403 || res.status === 401) { alert("Phiên đăng nhập hết hạn. Vui lòng đăng xuất và đăng nhập lại!"); }
                else { alert("Lỗi khi lưu! Vui lòng thử lại."); }
            });
        }
        function deletePost(id) { 
            if(confirm("Xóa tin tức này?")) fetch(API_BASE_URL + "/api/admin/posts/" + id, { method: "DELETE", headers: { "Authorization": jwtToken } }).then(() => loadPosts()); 
        }
    </script>
    <script src="config.js"></script>
</body>
</html>
