spring.application.name=htx
server.port=8081

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/htx_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Bangkok}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

logging.file.name=logs/spring.log
server.error.include-message=never
server.error.include-exception=false

# Application
app.jwt.secret=${JWT_SECRET:change-this-development-secret-before-production-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}
app.seed.enabled=${SEED_DATA:false}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}
